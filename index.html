<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>黑木股份有限公司報價系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: 登入頁左右分欄（品牌／登入卡）；登入後上方為三段式查價列，下方為料號清單；管理者為左客戶清單＋右編輯表。 */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#F4F6F7; --ink:#14181B; --muted:#5C6770; --line:#D3D9DE; --line-strong:#9AA5AE;
  --accent:#1E3D78; --accent-ink:#FFFFFF; --accent-soft:#E2E8F3;
  --edit:#FFF3D1; --edit-ink:#7A5200; --bad:#A3271E; --bad-soft:#F8E3E0; --ok:#24683A; --ok-soft:#DFF0E3;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-title:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1316; --surface:#171D21; --sunk:#1D252A; --ink:#E4E9EC; --muted:#93A0A9; --line:#2B353C; --line-strong:#4A5760;
  --accent:#8FB0EC; --accent-ink:#0C1830; --accent-soft:#1C2A44;
  --edit:#3A2F12; --edit-ink:#F0C96A; --bad:#F08A80; --bad-soft:#3A1E1B; --ok:#83C995; --ok-soft:#163021; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1316; --surface:#171D21; --sunk:#1D252A; --ink:#E4E9EC; --muted:#93A0A9; --line:#2B353C; --line-strong:#4A5760;
  --accent:#8FB0EC; --accent-ink:#0C1830; --accent-soft:#1C2A44;
  --edit:#3A2F12; --edit-ink:#F0C96A; --bad:#F08A80; --bad-soft:#3A1E1B; --ok:#83C995; --ok-soft:#163021; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* ---------- 登入頁 ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .brand{background:var(--ink);color:var(--bg);padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.login .brand::after{content:"";position:absolute;inset:auto -10% -40% auto;width:70%;aspect-ratio:1;border-radius:50%;border:40px solid color-mix(in srgb,var(--bg) 6%,transparent);pointer-events:none}
.login .co{font:900 clamp(30px,4.2vw,52px)/1.2 var(--f-title);letter-spacing:.06em;margin:0;text-wrap:balance}
.login .sys{font:700 clamp(18px,2vw,24px)/1.4 var(--f-title);letter-spacing:.5em;margin:10px 0 0;opacity:.85}
.login .rule{height:3px;width:64px;background:var(--bg);opacity:.6;margin:28px 0}
.login .blurb{max-width:34em;opacity:.78;font-size:14px}
.login .foot{font-size:12px;opacity:.6;position:relative;z-index:1}
.login .formside{display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.logincard{width:100%;max-width:380px;padding:32px}
.logincard h2{margin:0 0 4px;font-size:20px}
.logincard p.lede{margin:0 0 22px;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:500}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:12px;min-height:1.6em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.demo-box{margin-top:20px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:6px;font-size:13px;color:var(--muted)}
.demo-box b{color:var(--ink)}
.demo-box button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline}

/* ---------- 主畫面 ---------- */
header.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header.bar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.bar .co{font:900 17px/1.3 var(--f-title);letter-spacing:.06em}
.bar .co small{font:500 12px var(--f-body);letter-spacing:.2em;color:var(--muted);margin-left:8px}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.bar .who .id{font-family:var(--f-mono);background:var(--sunk);border:1px solid var(--line);padding:1px 8px;border-radius:4px;font-size:13px}
main.page{padding-block:24px 64px;display:grid;gap:20px}
main.page>*{min-width:0}
h1.ttl{font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}

.finder{padding:20px}
.selects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sel{display:grid;gap:6px;align-content:start;min-width:0}
.sel label{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.sel label .step{font:600 12px var(--f-mono);color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
.sel label .hint{font-weight:400;color:var(--muted);font-size:12px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
select.input:disabled{opacity:.55}
.filter3{font-size:13px;padding:7px 10px}

.result{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;padding:20px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.result .crumb{font-size:12px;color:var(--muted);letter-spacing:.04em}
.result .pname{font-size:18px;font-weight:700;margin:2px 0 6px;overflow-wrap:anywhere}
.result dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0;font-size:14px}
.result dt{color:var(--muted)}
.result dd{margin:0;overflow-wrap:anywhere}
.pricebox{text-align:right;align-self:start;min-width:180px}
.pricebox .lab{font-size:12px;color:var(--muted)}
.pricebox .amt{font:600 32px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pricebox .amt small{font-size:15px;color:var(--muted);margin-right:6px}
.pricebox .per{font-size:13px;color:var(--muted)}
.pricebox .ask{font-size:18px;font-weight:700;color:var(--edit-ink)}
.empty-result{margin-top:18px;padding:18px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);font-size:14px}

.listhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.listhead h2{font-size:16px;margin:0}
.listhead .count{font-size:13px;color:var(--muted)}
.listhead .search{margin-left:auto;width:min(320px,100%)}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--sunk)}
table.list tr.on td{background:var(--accent-soft)}
table.list .r{text-align:right;white-space:nowrap}
table.list .nm{font-weight:500}
table.list .sp{color:var(--muted);font-size:13px}
.cat{font-size:12px;color:var(--muted);white-space:nowrap}
.more{padding:14px 20px;text-align:center}
.askchip{font-size:12px;color:var(--edit-ink);background:var(--edit);padding:1px 8px;border-radius:99px;white-space:nowrap}
.notice{font-size:12px;color:var(--muted);padding:12px 20px}
/* 價格失效 */
.stale{color:var(--muted)}
.xchip{display:inline-block;font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:1px 8px;border-radius:99px;white-space:nowrap;font-family:var(--f-body)}
.pricebox .xnote{font-size:12px;color:var(--bad);margin-top:6px;max-width:220px;margin-left:auto}
.pricebox .actions{margin-top:14px;display:flex;justify-content:flex-end}
/* 詢價 */
.inqbtn{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.inqbtn.in{background:var(--accent-soft);border-color:transparent}
.cartbtn{display:inline-flex;align-items:center;gap:6px}
.cartbtn .n{font:600 12px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:20px;padding:0 6px;text-align:center}
.inq{display:grid;gap:20px}
table.inqt td{vertical-align:middle}
table.inqt tbody tr{cursor:default}
table.inqt input.qty{width:96px;padding:6px 8px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.inqt input.inote{width:100%;min-width:140px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:13px}
.linkbtn{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;padding:4px}
.cform{padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.cform .full{grid-column:1/-1}
.cform .field{margin:0}
.cform textarea{min-height:90px;resize:vertical}
.sendbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:0 20px 20px}
.done{padding:28px 24px;display:grid;gap:8px}
.done .big{font:900 24px/1.3 var(--f-title);margin:0}
.done .no{font:600 20px var(--f-mono);color:var(--accent)}
@media (max-width:900px){ .cform{grid-template-columns:minmax(0,1fr)} }

/* ---------- 管理者 ---------- */
.admin{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.custlist{position:sticky;top:76px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.custlist .top{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.custlist ul{list-style:none;margin:0;padding:0;overflow-y:auto}
.custlist li button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;text-align:left;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:14px}
.custlist li button:hover{background:var(--sunk)}
.custlist li button.on{background:var(--accent-soft)}
.custlist .cid{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.custlist .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custlist .cc{font-size:12px;color:var(--muted)}
.custlist .off{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.acctbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px}
.acctbar .nm{font-weight:700;font-size:16px}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pwshow{font-family:var(--f-mono);background:var(--edit);color:var(--edit-ink);padding:2px 8px;border-radius:4px;user-select:all}
table.edit td{padding:8px 10px;font-size:13px}
table.edit tbody tr{cursor:default}
table.edit tr.hiddenrow td{opacity:.55}
table.edit tr.dirty td{background:var(--edit)}
table.edit input.price{width:110px;padding:6px 8px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.edit input.price::placeholder{color:var(--line-strong)}
table.edit .note{font-size:12px;color:var(--edit-ink);max-width:260px}
.savebar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.bulk{padding:20px;display:grid;gap:14px}
.bulk textarea{min-height:200px;font-family:var(--f-mono);font-size:13px}
.bulk .opts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.bulk pre{margin:0;padding:12px;background:var(--sunk);border-radius:6px;font-size:12px;overflow-x:auto;max-height:240px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr);min-height:auto}
  .login .brand{padding:32px 20px;gap:20px}
  .login .rule{margin:16px 0}
  .selects{grid-template-columns:minmax(0,1fr)}
  .result{grid-template-columns:minmax(0,1fr)}
  .pricebox{text-align:left}
  .admin{grid-template-columns:minmax(0,1fr)}
  .custlist{position:static;max-height:360px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- API ---------- */
async function api(action, body = {}){
  const payload = { action, token: S.token, ...body };
  if (!CONFIG.API_URL) return demoApi(payload);
  const res = await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(payload) }); // text/plain：不觸發 CORS 預檢
  const j = await res.json();
  if (!j.ok){
    if (j.code === "AUTH"){ logout(true); }
    const e = new Error(j.error || "發生錯誤"); e.code = j.code; throw e;
  }
  return j;
}

const DEMO = { accts: { DEMO01:{name:"示範橡膠行", pw:"demo1234", role:"customer"}, DEMO02:{name:"Demo Toner Co.", pw:"demo1234", role:"customer"}, ADMIN:{name:"黑木（管理者）", pw:"admin1234", role:"admin"} }, sess:{} };
function demoPublic(x){
  const p = x.manualPrice != null ? x.manualPrice : x.erpPrice;
  return { part:x.part, name:x.name, spec:x.spec, custPart:x.custPart, cur:x.cur, unit:x.unit, price: p > 0 ? p : null,
    priceDate: x.manualPrice != null ? x.priceDate : x.lastShip.replace(/-/g,"/"), lastShip: x.lastShip.replace(/-/g,"/"), lastQty:x.lastQty,
    major:x.major, minor:x.minor, label:x.label,
    expired: (x.manualPrice != null ? x.priceDate : x.lastShip).replace(/-/g,"/") < DEMO_VALID_FROM };
}
const DEMO_VALID_FROM = "2026/04/01";
async function demoApi(r){
  await new Promise(ok => setTimeout(ok, 250));
  const fail = (m, code) => { const e = new Error(m); e.code = code; throw e; };
  const s = r.token && DEMO.sess[r.token];
  const need = (admin) => { if (!s) fail("登入已逾時，請重新登入","AUTH"); if (admin && s.role !== "admin") fail("沒有權限","AUTH"); return s; };
  switch (r.action){
    case "login": {
      const id = String(r.id||"").trim().toUpperCase(), a = DEMO.accts[id];
      if (!a || a.pw !== r.password) fail("客戶編號或密碼錯誤");
      const token = "demo" + Math.random().toString(36).slice(2);
      DEMO.sess[token] = { id, name:a.name, role:a.role, mustChange:false };
      return { token, user: DEMO.sess[token] };
    }
    case "logout": return {};
    case "changePassword": { const u = need(); if (String(r.newPassword||"").length < 8) fail("新密碼至少 8 個字元"); DEMO.accts[u.id].pw = r.newPassword; return { user:u }; }
    case "myItems": { const u = need(); return { items: DEMO_DATA.filter(x => x.cust === u.id && x.show).map(demoPublic), priceValidFrom: DEMO_VALID_FROM }; }
    case "inquiry": { const u = need(); if (u.role === "admin") fail("管理者帳號不能送出詢價，請用客戶帳號");
      if (!r.contact || !String(r.contact.name||"").trim() || !String(r.contact.phone||"").trim()) fail("請填寫聯絡人與電話");
      if (!r.items.length && !String(r.contact.note||"").trim()) fail("詢價清單是空的");
      const d = new Date(); return { inquiryNo: "R" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + "-" + String(Math.floor(Math.random()*900)+100), count: r.items.length }; }
    case "adminCustomers": need(true); return { customers: ["DEMO01","DEMO02"].map(id => ({ id, name:DEMO.accts[id].name, enabled:true, hasOwnPw:false, last:"", items: DEMO_DATA.filter(x=>x.cust===id).length })) };
    case "adminItems": { need(true); const items = DEMO_DATA.map((x,i)=>({...x,i})).filter(x => x.cust === r.cust).map(x => ({...demoPublic(x), row:x.i, erpPrice:x.erpPrice, manualPrice:x.manualPrice, show:x.show, note:x.note}));
      return { items, priceValidFrom: DEMO_VALID_FROM, account:{ id:r.cust, name:DEMO.accts[r.cust].name, enabled:true, hasOwnPw:false, last:"" } }; }
    case "adminSave": { need(true); const d = new Date(); const t = d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");
      r.changes.forEach(c => { const x = DEMO_DATA[c.row]; if (c.price !== undefined){ const np = c.price === null ? null : Number(c.price); if (np !== x.manualPrice){ x.manualPrice = np; x.priceDate = t; } } if (c.show !== undefined) x.show = c.show; });
      return { saved: r.changes.length, missing: [] }; }
    case "adminBulk": { need(true); let updated = 0; const nf = [], bad = [];
      String(r.text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((line,n) => {
        if (n === 0 && /編號|料號|單價/.test(line)) return;
        const f = line.split(/\t|,/).map(x=>x.trim());
        let cust, part, v;
        if (r.scope === "cust-part"){ [cust,part,v] = f; } else { cust = r.scope === "all" ? "" : r.scope; [part,v] = f; }
        v = Number(String(v||"").replace(/[,$\s]/g,""));
        if (!part || !isFinite(v) || v < 0){ bad.push(line); return; }
        const hits = DEMO_DATA.filter(x => x.part === part && (!cust || x.cust === cust));
        if (!hits.length){ nf.push(line); return; }
        hits.forEach(x => { x.manualPrice = v; x.priceDate = new Date().toISOString().slice(0,10).replace(/-/g,"/"); updated++; });
      });
      return { updated, notFound: nf, notFoundCount: nf.length, bad, badCount: bad.length }; }
    case "adminResetPassword": need(true); return { password: "Xk7" + Math.random().toString(36).slice(2,9) };
    case "adminSetEnabled": need(true); return {};
  }
  fail("未知的操作");
}

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn primary" data-act="bulkRun" ${S.busy?"disabled":""}>${S.busy?"更新中…":"套用價格"}</button>
      <span class="muted" style="font-size:13px">寫入「報價單價」欄並記錄在「價格異動紀錄」。</span></div>
    ${r ? `<div class="msg ${r.updated ? "ok" : "bad"}" style="font-size:14px">已更新 ${r.updated} 筆價格${r.notFoundCount ? `，${r.notFoundCount} 行找不到對應料號` : ""}${r.badCount ? `，${r.badCount} 行格式不正確` : ""}。</div>
      ${r.notFound.length ? `<div><div style="font-size:13px;margin-bottom:4px">找不到的行：</div><pre>${esc(r.notFound.join("\n"))}</pre></div>` : ""}
      ${r.bad.length ? `<div><div style="font-size:13px;margin-bottom:4px">格式不正確的行：</div><pre>${esc(r.bad.join("\n"))}</pre></div>` : ""}` : ""}
  </div>`;
}
async function loadCustomers(){
  try { const j = await api("adminCustomers"); S.customers = j.customers; renderCustList(); }
  catch(e){ $("#apanel").innerHTML = `<p class="msg bad" style="padding:20px">${esc(e.message)}</p>`; }
}
async function loadCust(id){
  if (Object.keys(S.dirty).length && S.cust !== id){ if (!S._confirmLeave){ S._confirmLeave = id; $("#amsg").innerHTML = `<b style="color:var(--bad)">有未儲存的修改。</b>再點一次客戶即放棄修改並切換。`; return; } }
  S._confirmLeave = null;
  Object.assign(S, { cust:id, acct:null, aItems:[], dirty:{}, atab:"items", aq:"", newPw:"", onlyHidden:false, busy:true });
  renderCustList(); renderAPanel();
  try { const j = await api("adminItems", { cust:id }); S.aItems = j.items; S.acct = j.account; }
  catch(e){ $("#apanel").innerHTML = `<p class="msg bad" style="padding:20px">${esc(e.message)}</p>`; return; }
  finally { S.busy = false; }
  renderAPanel();
}
function markDirty(row, patch){
  const it = S.aItems.find(x => x.row === row); if (!it) return;
  const d = { ...(S.dirty[row] || {}), ...patch };
  if (d.price !== undefined && (d.price === null ? it.manualPrice == null : Number(d.price) === it.manualPrice)) delete d.price;
  if (d.show !== undefined && d.show === it.show) delete d.show;
  if (Object.keys(d).length) S.dirty[row] = d; else delete S.dirty[row];
}

/** 改價／勾選後只更新該列與儲存列，不重繪整張表（保留游標位置，可連續用 Tab 輸入） */
function updateDirtyUI(row){
  const tr = document.querySelector(`tr[data-row="${row}"]`), it = S.aItems.find(x => x.row === row);
  if (tr && it){ tr.classList.toggle("dirty", !!S.dirty[row]); tr.classList.toggle("hiddenrow", !effShow(it)); }
  const nd = Object.keys(S.dirty).length, m = $("#amsg");
  if (m) m.textContent = nd ? `已修改 ${nd} 項，尚未儲存` : "價格欄留空 = 客戶看到最近訂單單價；兩者皆為 0 時顯示「請洽業務」";
  document.querySelectorAll('[data-act="save"],[data-act="discard"]').forEach(b => b.disabled = !nd || S.busy);
}

/* ---------- 事件 ---------- */
const ACT = {
  inqAdd(el){
    const key = el.dataset.key;
    if (!S.inq.some(x => x.key === key)) S.inq.push({ key, qty: "", note: "" });
    saveInq();
    if (S.view === "customer"){ renderFinder(); renderList(); }
  },
  inqView(){ S.view = "inquiry"; S.inqDone = null; S.inqMsg = ""; render(); window.scrollTo(0, 0); },
  inqRemove(el){ S.inq.splice(+el.dataset.i, 1); saveInq(); render(); },
  inqFinish(){ S.inqDone = null; S.view = "customer"; render(); },
  logout(){ logout(false); },
  pwView(){ S.view = "password"; render(); },
  home(){ S.view = S.user.role === "admin" ? "admin" : "customer"; render(); },
  demoFill(el){ $("#lg_id").value = el.dataset.id; $("#lg_pw").value = el.dataset.pw; $("#lg_pw").focus(); },
  clearSel(){ S.l1 = S.l2 = S.l3 = S.f3 = ""; S.shown = LIST_PAGE; renderFinder(); renderList(); },
  more(){ S.shown += LIST_PAGE; renderList(); },
  pickCust(el){ loadCust(el.dataset.id); },
  bulkOpen(){ S.atab = "bulk"; if (S.cust && S.bulkScope === "cust-part") S.bulkScope = S.cust; renderAPanel(); },
  bulkClose(){ S.atab = "items"; renderAPanel(); },
  discard(){ S.dirty = {}; renderAPanel(); },
  async save(){
    const changes = Object.entries(S.dirty).map(([row,d]) => { const it = S.aItems.find(x => x.row === +row); return { row:+row, cust:S.cust, part:it.part, cur:it.cur, ...d }; });
    const bad = changes.find(c => c.price !== undefined && c.price !== null && !(isFinite(c.price) && c.price >= 0));
    if (bad){ $("#amsg").textContent = `產品 ${bad.part} 的價格不是有效數字`; return; }
    S.busy = true; renderAPanel();
    try {
      const j = await api("adminSave", { changes });
      S.busy = false; const id = S.cust; S.dirty = {};
      await loadCust(id);
      $("#amsg").innerHTML = `<span style="color:var(--ok)">已儲存 ${j.saved} 項變更${j.missing.length ? `；${j.missing.length} 項找不到（資料可能已被移動）` : ""}</span>`;
    } catch(e){ S.busy = false; renderAPanel(); $("#amsg").textContent = "儲存失敗：" + e.message; }
  },
  async bulkRun(){
    S.bulkText = $("#bulkText").value;
    if (!S.bulkText.trim()) return;
    S.busy = true; S.bulkResult = null; renderAPanel();
    try { S.bulkResult = await api("adminBulk", { scope: S.bulkScope, text: S.bulkText }); }
    catch(e){ S.bulkResult = { updated:0, notFound:[], notFoundCount:0, bad:[e.message], badCount:1 }; }
    S.busy = false; renderAPanel();
  },
  async resetPw(el){
    if (!S._confirmReset){ S._confirmReset = true; el.textContent = "確定重設？再按一次"; setTimeout(() => { S._confirmReset = false; if (el.isConnected) el.textContent = "重設密碼"; }, 4000); return; }
    S._confirmReset = false;
    try { const j = await api("adminResetPassword", { cust:S.cust }); S.newPw = j.password; if (S.acct){ S.acct.hasOwnPw = false; S.acct.enabled = true; } renderAPanel(); }
    catch(e){ $("#amsg").textContent = e.message; }
  },
  async toggleAcct(){
    const en = !(S.acct && S.acct.enabled);
    try { await api("adminSetEnabled", { cust:S.cust, enabled:en }); S.acct.enabled = en; const c = S.customers.find(x => x.id === S.cust); if (c) c.enabled = en; renderAPanel(); renderCustList(); }
    catch(e){ $("#amsg").textContent = e.message; }
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el){ const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el); } return; }
  const tr = e.target.closest("table.list:not(.edit):not(.inqt) tbody tr[data-key]");
  if (tr) selectItem(tr.dataset.key);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "s1"){ S.l1 = t.value; S.l2 = S.l3 = S.f3 = ""; S.shown = LIST_PAGE;
    if (S.l1){ const m = [...groups().get(S.l1).keys()]; if (m.length === 1) S.l2 = m[0]; }
    renderFinder(); renderList(); }
  else if (t.id === "s2"){ S.l2 = t.value; S.l3 = S.f3 = ""; S.shown = LIST_PAGE;
    if (S.l2){ const p = S.items.filter(it => it.major === S.l1 && it.minor === S.l2); if (p.length === 1) S.l3 = keyOf(p[0]); }
    renderFinder(); renderList(); }
  else if (t.id === "s3"){ S.l3 = t.value; renderFinder(); renderList(); }
  else if (t.classList.contains("showbox")){ markDirty(+t.dataset.row, { show: t.checked }); updateDirtyUI(+t.dataset.row); }
  else if (t.classList.contains("price")){ const v = t.value.trim().replace(/,/g,""); markDirty(+t.dataset.row, { price: v === "" ? null : Number(v) }); updateDirtyUI(+t.dataset.row); }
  else if (t.id === "onlyHidden"){ S.onlyHidden = t.checked; renderAPanel(); }
  else if (t.name === "scope"){ S.bulkScope = t.value; S.bulkText = $("#bulkText").value; renderAPanel(); }
});
let timer;
document.addEventListener("input", e => {
  const t = e.target;
  const debounce = (fn) => { clearTimeout(timer); timer = setTimeout(fn, 160); };
  if (t.classList.contains("qty")){ S.inq[+t.dataset.i].qty = t.value; saveInq(); return; }
  if (t.classList.contains("inote")){ S.inq[+t.dataset.i].note = t.value; saveInq(); return; }
  if (t.dataset.c){ S.contact[t.dataset.c] = t.value; const { note, ...keep } = S.contact; lstore.set("hm_contact_" + (S.user && S.user.id), keep); return; }
  if (t.id === "q"){ S.q = t.value; S.shown = LIST_PAGE; debounce(() => { S._focusQ = true; renderList(); }); }
  else if (t.id === "f3"){ S.f3 = t.value; debounce(() => { S._focusF3 = true; renderFinder(); }); }
  else if (t.id === "cq"){ S.cq = t.value; debounce(() => { S._focusCq = true; renderCustList(); }); }
  else if (t.id === "aq"){ S.aq = t.value; debounce(() => { S._focusAq = true; renderAPanel(); }); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginForm"){
    const id = $("#lg_id").value.trim(), pw = $("#lg_pw").value;
    if (!id || !pw){ setMsg("請輸入客戶編號與密碼"); return; }
    S.busy = true; S.msg = ""; render();
    try {
      const j = await api("login", { id, password: pw });
      S.token = j.token; S.user = j.user; store.set("hm_sess", { token:j.token, user:j.user }); loadUserLocal();
      S.view = j.user.mustChange ? "password" : j.user.role === "admin" ? "admin" : "customer";
      S.busy = false; render();
    } catch(err){ S.busy = false; render(); $("#lg_id").value = id; setMsg(err.message); }
  }
  if (e.target.id === "inqForm"){
    const c = S.contact, m = $("#inqMsg");
    const bad = S.inq.find(x => x.qty !== "" && !(Number(String(x.qty).replace(/,/g,"")) > 0));
    if (!String(c.name||"").trim() || !String(c.phone||"").trim()){ m.textContent = "請填寫聯絡人與電話"; return; }
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())){ m.textContent = "Email 格式不正確"; return; }
    if (bad){ m.textContent = "需求數量請填正數，或留空"; return; }
    if (!S.inq.length && !String(c.note||"").trim()){ m.textContent = "請加入詢價品項，或在需求說明描述要詢價的產品"; return; }
    S.busy = true; S.inqMsg = ""; render();
    try {
      const items = S.inq.map(x => { const it = S.items.find(y => keyOf(y) === x.key); return it ? { part: it.part, cur: it.cur, qty: String(x.qty).replace(/,/g,""), note: x.note } : null; }).filter(Boolean);
      const j = await api("inquiry", { items, contact: c });
      S.inqDone = j; S.inq = []; saveInq(); S.contact.note = "";
    } catch(err){ S.inqMsg = "送出失敗：" + err.message; }
    S.busy = false; render(); window.scrollTo(0, 0);
    return;
  }
  if (e.target.id === "pwForm"){
    const old = $("#pw_old"), n1 = $("#pw_new").value, n2 = $("#pw_new2").value;
    if (n1.length < 8 || !/[A-Za-z]/.test(n1) || !/\d/.test(n1)){ setMsg("新密碼至少 8 個字元，且需包含英文字母與數字"); return; }
    if (n1 !== n2){ setMsg("兩次輸入的新密碼不一致"); return; }
    try {
      const j = await api("changePassword", { newPassword:n1, ...(old ? { oldPassword: old.value } : {}) });
      S.user = j.user; store.set("hm_sess", { token:S.token, user:S.user });
      S.view = S.user.role === "admin" ? "admin" : "customer"; render();
    } catch(err){ setMsg(err.message); }
  }
});

/* ---------- 畫面 ---------- */
function loadUserLocal(){
  if (!S.user) return;
  S.inq = store.get("hm_inq_" + S.user.id) || [];
  S.contact = lstore.get("hm_contact_" + S.user.id) || {};
}
function render(){
  const app = $("#app");
  if (S.view === "login"){ app.innerHTML = vLogin(); return; }
  if (S.view === "password"){ app.innerHTML = vPassword(); return; }
  if (S.view === "inquiry"){ app.innerHTML = vInquiry(); if (!S.items.length && !S.busy) loadItems().then(() => { if (S.view === "inquiry") app.innerHTML = vInquiry(); }); return; }
  if (S.view === "customer"){ app.innerHTML = vCustomer(); renderFinder(); renderList(); if (!S.items.length && !S.busy) loadItems(); return; }
  if (S.view === "admin"){ app.innerHTML = vAdmin(); renderCustList(); renderAPanel(); if (!S.customers.length) loadCustomers(); return; }
}
(function boot(){
  const s = store.get("hm_sess");
  if (s && s.token && (CONFIG.API_URL || DEMO.sess[s.token])){ S.token = s.token; S.user = s.user; loadUserLocal(); S.view = s.user.mustChange ? "password" : s.user.role === "admin" ? "admin" : "customer"; }
  render();
})();
</script>
</body>
